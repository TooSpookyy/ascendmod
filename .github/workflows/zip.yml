name: Build aus ZIP
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1
      - name: ZIP entpacken
        run: unzip -q ./*.zip -d proj
      - name: Mod bauen
        working-directory: proj
        run: |
          gradle build --no-daemon > build.log 2>&1 || { echo "=== COMPILERFEHLER (kompakt) ==="; grep -E "error:|symbol:|location:|What went wrong|Could not" build.log | sed 's#.*/de/ascend/client/##'; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: ascendclient-jar
          path: proj/build/libs/ascendclient-1.0.0.jar
